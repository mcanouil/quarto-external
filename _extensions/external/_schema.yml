# Schema for the external extension

$schema: https://m.canouil.dev/quarto-wizard/assets/schema/v2/extension-schema.json

shortcodes:
  external:
    description: "Includes external markdown content from a file, optionally targeting a specific section, div, or line range."
    arguments:
      - name: file
        type: string
        required: true
        description: "Path to the markdown file to include, optionally followed by '#id' for a section or div, or '#L<start>-<end>' (or '#L<n>') for a line range."
        completion:
          type: file
          extensions:
            - .md
            - .markdown
            - .qmd
    attributes:
      shift-heading-level-by:
        type: integer
        description: "Number of levels to shift headings in the included content, where values outside the range minus five to five saturate and produce a warning."
        aliases:
          - shift
      dedent:
        type: boolean
        description: "When true, strip the longest common leading whitespace from every code block in the included content."
